<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-3xl border border-gray-200">
        
        <!-- Header -->
        <div class="text-center mb-8 border-b pb-4">
            <h1 class="text-3xl font-extrabold text-blue-700 mb-2">Student Admission Portal</h1>
            <p class="text-gray-500 font-medium">Agile Software Development & DevOps Lab</p>
        </div>
        
        <!-- Admission Form -->
        <form id="admissionForm" class="space-y-5" onsubmit="event.preventDefault(); submitForm();">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">First Name</label>
                    <input type="text" id="fName" required class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Harsh">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Last Name</label>
                    <input type="text" id="lName" required class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Patil">
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                    <input type="email" required class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="student@email.com">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Phone Number</label>
                    <input type="tel" required class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="+91 9876543210">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Select Course</label>
                <select id="course" class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option>B.E. Computer Science & Engineering</option>
                    <option>B.E. Data Science</option>
                    <option>B.E. Information Technology</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Previous Academic Percentage (%)</label>
                <input type="number" id="percentage" required min="0" max="100" class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. 85">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors mt-4">
                Enroll Student
            </button>
        </form>

        <div id="alertBox" class="hidden mt-4 p-3 rounded-lg text-sm text-center font-bold"></div>

        <!-- Dynamic Records Table (Hidden until first submission) -->
        <div id="recordsContainer" class="mt-8 pt-6 border-t border-gray-200 hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Recently Enrolled Students</h2>
            <div class="overflow-hidden rounded-lg border border-gray-200 shadow-sm">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 text-gray-600 text-sm">
                        <tr>
                            <th class="py-3 px-4 border-b">Student Name</th>
                            <th class="py-3 px-4 border-b">Course</th>
                            <th class="py-3 px-4 border-b">Score</th>
                            <th class="py-3 px-4 border-b text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="text-sm bg-white divide-y divide-gray-100">
                        <!-- Rows dynamically added here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        function submitForm() {
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            
            // Capture the typed data
            const fName = document.getElementById('fName').value;
            const lName = document.getElementById('lName').value;
            const course = document.getElementById('course').value;
            const percentage = document.getElementById('percentage').value;
            
            btn.innerText = "Processing via CI/CD Backend...";
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            // Ping your actual Render backend API
            fetch('/api/health')
                .then(res => res.json())
                .then(data => {
                    setTimeout(() => {
                        // 1. Reset the button
                        btn.innerText = "Enroll Another Student";
                        btn.classList.remove('opacity-75', 'cursor-not-allowed');
                        
                        // 2. Show success message
                        alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                        alertBox.classList.add('bg-green-100', 'text-green-800');
                        alertBox.innerText = `✅ ${fName} ${lName} Enrolled Successfully!`;
                        
                        // 3. Add the student to the table
                        document.getElementById('recordsContainer').classList.remove('hidden');
                        const tbody = document.getElementById('studentTableBody');
                        const newRow = `
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="py-3 px-4 font-semibold text-gray-800">${fName} ${lName}</td>
                                <td class="py-3 px-4 text-gray-600">${course}</td>
                                <td class="py-3 px-4 font-medium text-blue-600">${percentage}%</td>
                                <td class="py-3 px-4 text-center">
                                    <span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold tracking-wide">CONFIRMED</span>
                                </td>
                            </tr>
                        `;
                        tbody.innerHTML += newRow; // This stacks the new row below the older ones

                        // 4. Clear the form so it's empty for the next student
                        document.getElementById('admissionForm').reset();
                    }, 800); // Tiny delay to make the "processing" look realistic
                })
                .catch(() => {
                    btn.innerText = "Enroll Student";
                    btn.classList.remove('opacity-75', 'cursor-not-allowed');
                    alertBox.classList.remove('hidden', 'bg-green-100', 'text-green-800');
                    alertBox.classList.add('bg-red-100', 'text-red-700');
                    alertBox.innerText = "❌ Connection Error: Backend API is offline.";
                });
        }
    </script>
</body>
</html>
