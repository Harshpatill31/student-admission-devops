<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-10 rounded-xl shadow-xl w-full max-w-lg text-center">
        <h1 class="text-3xl font-extrabold text-indigo-600 mb-2">Admission Portal</h1>
        <p class="text-gray-500 mb-8">Agile Software Development & DevOps Lab</p>
        
        <button onclick="checkStatus()" id="statusBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg">
            Check API Status
        </button>

        <p id="result" class="mt-4 font-medium text-green-600 hidden"></p>
    </div>

    <script>
        function checkStatus() {
            document.getElementById('statusBtn').innerText = "Connecting to Backend...";
            fetch('/api/health')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('result').classList.remove('hidden');
                    document.getElementById('result').innerText = "✅ System Online: " + data.message;
                    document.getElementById('statusBtn').innerText = "Connected Successfully";
                })
                .catch(() => {
                    document.getElementById('result').classList.remove('hidden');
                    document.getElementById('result').className = "mt-4 font-medium text-red-600";
                    document.getElementById('result').innerText = "❌ Cannot connect to backend.";
                    document.getElementById('statusBtn').innerText = "Check API Status";
                });
        }
    </script>
</body>
</html>
