name: Student Admission CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Run Unit Tests
      run: |
        cd backend
        npm test

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        cd backend
        # Build the image with the specific GHCR URL format
        docker build -t ghcr.io/${{ github.repository_owner }}/student-admission-backend:latest .
        # Push the image to your GitHub Packages
        docker push ghcr.io/${{ github.repository_owner }}/student-admission-backend:latest

    - name: Deploy to Render
