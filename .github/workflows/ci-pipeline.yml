name: Student Admission CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Get the code from GitHub
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Set up the Node environment
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # Step 3: Install backend dependencies to ensure there are no errors
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install

    # Step 4: Test the Docker Build automatically
    - name: Build Docker Image
      run: |
        cd backend
        docker build -t student-admission-backend .